# JobAgent full-stack local/staging orchestration
#
# Default stack (SQLite, persisted in the appdata volume):
#   docker compose up --build
#
# Postgres stack (starts local Postgres and points the services at it):
#   DB_DRIVER=postgres \
#   DATABASE_URL=postgres://jobagent:jobagent@db:5432/jobagent \
#   docker compose --profile with-pg up --build
#
# Required environment:
#   GITHUB_TOKEN  Fine-grained PAT (public repos read-only). The worker fails
#                 fast and exits when it is missing, because unauthenticated
#                 GitHub access is capped at 60 req/h. Export it in your shell
#                 or put it in a root-level .env file (compose loads .env
#                 automatically); never commit the token.
#
# Services:
#   api     -> http://localhost:3000
#   worker  -> background analysis consumer (requires GITHUB_TOKEN)
#   report  -> http://localhost:4321
#   db      -> local Postgres (profile: with-pg)

services:
  db:
    image: postgres:16-alpine
    profiles: ["with-pg"]
    environment:
      POSTGRES_USER: jobagent
      POSTGRES_PASSWORD: jobagent
      POSTGRES_DB: jobagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobagent"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      target: api
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      DB_PATH: /app/data/job-agent.db
      DATABASE_URL: ${DATABASE_URL:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - appdata:/app/data
    depends_on:
      db:
        condition: service_healthy
        required: false

  worker:
    build:
      context: .
      target: worker
    environment:
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      DB_PATH: /app/data/job-agent.db
      DATABASE_URL: ${DATABASE_URL:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      POLL_INTERVAL_MS: "2000"
    volumes:
      - appdata:/app/data
    depends_on:
      db:
        condition: service_healthy
        required: false

  report:
    build:
      context: .
      target: report
    ports:
      - "4321:4321"
    environment:
      REPORT_PORT: "4321"
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      DB_PATH: /app/data/job-agent.db
      DATABASE_URL: ${DATABASE_URL:-}
    volumes:
      - appdata:/app/data
    depends_on:
      db:
        condition: service_healthy
        required: false

volumes:
  pgdata:
  appdata:
