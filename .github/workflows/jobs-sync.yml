name: Jobs sync

# Production job-posting ingestion for form C (see
# docs/deployment-runbook-20260920.md §4-C/§7): long-running collection does
# NOT run inside Vercel serverless functions. GitHub Actions runs the CLI
# against the production Postgres on a schedule.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL  Production Supabase SESSION pooler / direct connection
#                 (port 5432, NOT the 6543 transaction pooler — the CLI is a
#                 long-lived non-serverless client and also upserts in
#                 multi-statement batches).
# Optional secrets:
#   JOB_HTTP_PROXY  Outbound proxy if the runner network needs one.
# No GitHub/Gitee token is needed: the five job sources are public APIs.
#
# Manual runs: Actions → Jobs sync → Run workflow, pick daily or hn-monthly.
#
# While DATABASE_URL is absent (form C not yet deployed), scheduled runs finish
# successfully with the install/build/sync steps skipped and a visible warning;
# a manual workflow_dispatch run still fails fast to surface the misconfiguration.

on:
  schedule:
    # Daily sources (RemoteOK/Remotive/Greenhouse/Lever), mark stale after 7d.
    # Off the top of the hour; UTC (18:17 UTC ≈ next-morning Asia time).
    - cron: '17 18 * * *'
    # HN "Who is hiring" is a monthly free-text thread; day 1, 18:42 UTC.
    # Uses --stale-days 35 because markStale is global and must not retire
    # daily-source jobs observed within the last week.
    - cron: '42 18 1 * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which ingestion to run'
        type: choice
        default: daily
        options:
          - daily
          - hn-monthly

permissions:
  contents: read

concurrency:
  # Never let two sync runs overlap (e.g. manual run during a scheduled one).
  group: jobs-sync-${{ github.event.inputs.target || 'scheduled' }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      # The form C production database is provisioned out-of-band (Runbook
      # §4-C, handoff item37 P0-3). Until the DATABASE_URL secret exists, an
      # unattended schedule run has nothing to sync: skip the build and ingestion
      # with a visible warning instead of failing every night. A manual dispatch
      # is an explicit operator request, so a missing secret there stays a hard
      # error. The CLI still fails fast as a last line of defense.
      - name: Guard DATABASE_URL secret
        id: guard
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "has_db=true" >> "$GITHUB_OUTPUT"
            echo "DATABASE_URL is configured; ingestion will run."
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo '::error::repository secret DATABASE_URL is not set. Add the Supabase 5432 SESSION pooler connection string at Settings -> Secrets and variables -> Actions (see workflow header and Runbook §4-C).'
            exit 1
          else
            echo '::warning::DATABASE_URL is not configured yet (form C production database not provisioned; handoff item37 P0-3). Skipping this scheduled ingestion — add the secret to activate the cron.'
            echo "has_db=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.guard.outputs.has_db == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.guard.outputs.has_db == 'true'
        run: pnpm -r build

      - name: Daily job sources sync
        if: |
          steps.guard.outputs.has_db == 'true' &&
          ((github.event_name == 'workflow_dispatch' && inputs.target == 'daily') ||
           (github.event_name == 'schedule' && github.event.schedule == '17 18 * * *'))
        env:
          DB_DRIVER: postgres
          DB_AUTO_MIGRATE: 'false'
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JOB_HTTP_PROXY: ${{ secrets.JOB_HTTP_PROXY }}
        run: node apps/cli/dist/index.js jobs sync

      - name: Monthly HN who-is-hiring sync
        if: |
          steps.guard.outputs.has_db == 'true' &&
          ((github.event_name == 'workflow_dispatch' && inputs.target == 'hn-monthly') ||
           (github.event_name == 'schedule' && github.event.schedule == '42 18 1 * *'))
        env:
          DB_DRIVER: postgres
          DB_AUTO_MIGRATE: 'false'
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JOB_HTTP_PROXY: ${{ secrets.JOB_HTTP_PROXY }}
        run: node apps/cli/dist/index.js jobs sync --source hn_whoishiring --stale-days 35
