name: CI

on:
  push:
  pull_request:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint workflows with actionlint
        # Pinned image so syntax/expression errors fail on push and PR instead
        # of relying on manual local runs.
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.12 -color

  ci:
    runs-on: ubuntu-latest
    # Real Postgres for packages/storage postgres-behavior.test.ts; when
    # DATABASE_TEST_URL is set the tests use it instead of booting embedded PG.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobagent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jobagent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_TEST_URL: postgres://postgres:postgres@localhost:5432/jobagent_test
    steps:
      # Major versions pinned to node24-based actions to clear the Node 20
      # deprecation warnings (verified action.yml inputs stay compatible).
      - uses: actions/checkout@v7
        with:
          # gitleaks scans a base..head commit range and needs the parent commits;
          # a shallow clone (default depth 1) makes that range unresolvable.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # Build before typecheck: workspace packages (e.g. storage) resolve
        # @jobagent/shared types from its dist output, which does not exist
        # on a fresh checkout until shared has been built.
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm e2e

      - name: Extension E2E tests
        # Loads the unpacked MV3 extension in --headless=new chromium (no xvfb needed);
        # the script rebuilds apps/extension/dist before launching. See
        # docs/design-extension-e2e-20260914.md.
        run: pnpm e2e:extension

      - name: Docker build smoke
        # Build the api target (exercises deps + full monorepo build) and the
        # report target (verifies the Astro standalone entry path). The worker
        # target reuses the same node-runtime layer as api and is covered by it.
        run: |
          docker build --target api -t jobagent-api:ci .
          docker build --target report -t jobagent-report:ci .

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
