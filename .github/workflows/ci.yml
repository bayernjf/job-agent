name: CI

on:
  push:
  pull_request:

# Cancel superseded runs when new commits land: for a PR key by PR number,
# otherwise by ref. The push run and pull_request run of the same head are kept
# distinct (they guard the branch and the PR merge gate separately); this only
# cancels stale runs from earlier commits so CI minutes are not wasted.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint workflows with actionlint
        # Pinned image so syntax/expression errors fail on push and PR instead
        # of relying on manual local runs.
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.12 -color

  ci:
    runs-on: ubuntu-latest
    # Real Postgres for packages/storage postgres-behavior.test.ts; when
    # DATABASE_TEST_URL is set the tests use it instead of booting embedded PG.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobagent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jobagent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_TEST_URL: postgres://postgres:postgres@localhost:5432/jobagent_test
    steps:
      # Major versions pinned to node24-based actions to clear the Node 20
      # deprecation warnings (verified action.yml inputs stay compatible).
      - uses: actions/checkout@v7
        with:
          # gitleaks scans a base..head commit range and needs the parent commits;
          # a shallow clone (default depth 1) makes that range unresolvable.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # Build before typecheck: workspace packages (e.g. storage) resolve
        # @jobagent/shared types from its dist output, which does not exist
        # on a fresh checkout until shared has been built.
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Check migrations
        # Static naming/numbering/header alignment guard for both dialects;
        # runs before the unit tests so a broken migration fails early.
        run: bash tools/check-migrations.sh

      - name: Test
        run: pnpm -r test

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm e2e

      - name: Upload report E2E artifacts
        # Always run so a failed run still ships the error-context traces,
        # screenshots and HTML report needed to debug page.goto timeouts etc.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-e2e-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Agent workbench full-stack E2E
        # 真 API + 真 SQLite + 真报告页（不 mock）：能抓到只在真链路上暴露的字段/契约
        # 错配（2026-10-03 的工作台简历下载 404 就是这样发现的）。夹具由
        # e2e/agent/global-setup.ts 直接写库，零网络。见 playwright.agent.config.ts。
        run: pnpm e2e:agent

      - name: Upload agent E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-e2e-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Extension E2E tests
        # Loads the unpacked MV3 extension in --headless=new chromium (no xvfb needed);
        # the script rebuilds apps/extension/dist before launching. See
        # docs/design-extension-e2e-20260914.md.
        run: pnpm e2e:extension

      - name: Upload extension E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-e2e-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Docker build smoke
        # Build the api target (exercises deps + full monorepo build) and the
        # report target (verifies the Astro standalone entry path). The worker
        # target reuses the same node-runtime layer as api and is covered by it.
        run: |
          docker build --target api -t jobagent-api:ci .
          docker build --target report -t jobagent-report:ci .

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
