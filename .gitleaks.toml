# Gitleaks config: extend the built-in ruleset with narrowly scoped allowlists.
#
# `[extend] useDefault = true` is required — supplying a config file replaces the
# default ruleset unless the defaults are explicitly extended, which would
# silently disable every built-in rule.
#
# Every entry must justify why the flagged value is not a credential. Keep
# entries narrow (a specific value shape), never a bare `paths` entry covering a
# whole directory or file — that would hide any real secret in it.

[extend]
useDefault = true

# A Chrome extension manifest carries a base64 SPKI *public* key in `key` (it
# pins the unpacked extension ID). It is published, not secret, but its entropy
# trips the `generic-api-key` rule.
#
# Allowlisting on the decoded public-key header keeps this non-secret by
# construction: a private key is a different ASN.1 structure and does not start
# with that header (2048-bit PKCS#8 private keys start with
# `MIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQ`), so a private key
# committed anywhere — including in the same manifest — is still reported.
#
# Regex-only on purpose (no `paths`): `condition = "AND"` is not honoured by
# every gitleaks release (8.24.3, used by gitleaks-action@v3, silently falls
# back to OR), which would widen a path-scoped entry into "any finding in this
# file". Verified against gitleaks 8.24.3 and 8.30.1: the manifest `key` is
# ignored while a planted `private-key` and `github-pat` are still reported.

[allowlist]
# Non-credential values allowlisted by exact shape (never by path, so a real
# credential anywhere — including in the same files — is still reported):
# 1) Base64 RSA public key (Chrome extension manifest `key`), published not secret;
# 2) fake placeholder API keys used only in unit-test fixtures (also annotated
#    inline with `// gitleaks:allow` in the sources);
# 3) public client-side distribution keys captured verbatim in the third-party
#    job-board HTML fixtures under tests/fixtures/ats/ (commit 139f35e). Every
#    one of these is a value the site itself ships to every anonymous browser:
#    reCAPTCHA/hCaptcha *site* keys, a Datadog RUM *client* token (`pub…`
#    prefix), a Rollbar `post_client_item` token, a Dropbox Chooser app key,
#    Greenhouse's location-service key, and a GCP API key Greenhouse embeds in
#    its public job-board pages. None of them is a credential of this project.
# 4) a GitHub achievements-page click HMAC captured in the github fixture
#    (commit c11f6a2) — a per-request anti-abuse token GitHub ships inside its
#    own public HTML, not a credential of this project. The slimming commit
#    657ba64 removed it from the file, but gitleaks scans the commit range, so
#    the historical addition is what trips the `generic-api-key` rule.
#
#    They are pinned as exact values, not shape regexes, on purpose: reCAPTCHA
#    *secret* keys share the `6L…` shape with site keys, and Rollbar
#    *server* tokens share the 32-hex shape with client tokens, so any
#    shape-based entry would silently hide real secrets.
description = "Public extension manifest key, fake test-fixture API keys, and public client keys in captured ATS/GitHub fixtures"
regexes = [
  '^MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8A[A-Za-z0-9+/]+={0,2}$',
  '^sk-(bob-secret-9876|byok-key|secret-1234|abcdef1234|test-key-1234567890abcdef1234567890abcdef|x)$',
  '^test-enc-key-20261003$',
  '^test-enc-key-20261014$',
  '^pub1a87c7036063ee7d4b7914b397e6324e$',
  '^6LeFb_YUAAAAALUD5h-BiQEp8JaFChe0e0A6r49Y$',
  '^6LezdY0tAAAAAEnollNLCAI0z1VDGwM7AzGrU4XZ$',
  '^6LfmcbcpAAAAAChNTbhUShzUOAMj_wY9LQIvLFX0$',
  '^AIzaSyBeoz4WOjOsy8ZJFIkkQBvL8BZQCzLplHQ$',
  '^mh9jyh4mfwjnfhj$',
  '^ge-39f1178289d5d0c5$',
  '^fb557f59a5a84ab788801dd742eacf34$',
  '^e33f87f8-88ec-4e1a-9a13-df9bbb1d8120$',
  '^6a247c6ff13012d02fde17377f0b857b$',
  '^5dccbd5a7b5b760c47b85c725c40c6fea92aad9189df71d8e04818fa175f89b6$',
]
